
name: Simple CI Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  Run-Script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Script
        run: |
          echo "Running script..."
          chmod +x ./script.sh || echo "script not found, creating"
          ls -la
          cat app.txt || echo "Welcome to DevOps"
